{% extends 'base.html' %}
{% block title %}Cadastro | NEXO{% endblock %}
{% block body_class %}setup-page{% endblock %}
{% block content %}
<main class="setup-card">
  <div class="setup-brand">NEXO<span>.</span></div>
  <h1>Criar conta</h1>
  {% include 'messages.html' %}
  <form method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-field"><label for="username">Usuário</label><input id="username" name="username" maxlength="40" autocomplete="username" required></div>
    <div class="form-field"><label for="display_name">Nome</label><input id="display_name" name="display_name" maxlength="80" autocomplete="name" required></div>
    <div class="form-field"><label for="password">Senha (mínimo 12 caracteres)</label><input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div>
    <div class="form-field"><label for="confirm_password">Confirmar senha</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div>
    <button class="primary-button" type="submit">Criar conta</button>
  </form>
  <a class="text-link" href="{{ url_for('auth.login') }}">Voltar ao login</a>
</main>
{% endblock %}
